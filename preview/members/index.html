<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101A2E">
<meta name="description" content="LIFE STAGE 2.0 ワーク（全メンバー向け）">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>LIFE STAGE 2.0 全メンバー版</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#101A2E; --surface:#192640; --surface2:#1F2E4D; --line:rgba(245,245,240,.10); --line2:rgba(199,170,112,.35);
  --text:#F5F5F0; --muted:#A9B1C3; --gold:#C7AA70; --gold-soft:rgba(199,170,112,.14);
  --ok:#7FC8A9; --warn:#E3B566; --err:#E58C8C;
  --r:18px; --t:180ms; --nav:64px;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  --serif:"Cormorant Garamond","Times New Roman",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);
  background:radial-gradient(120% 60% at 50% -10%,rgba(199,170,112,.10),transparent 60%),var(--bg)}
a{color:var(--gold)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(16,26,46,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.brand{font-family:var(--serif);letter-spacing:.24em;font-size:15px;color:var(--gold);white-space:nowrap}
.brand b{font-weight:600;color:var(--text);letter-spacing:.12em}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.save.saving i{background:var(--warn)} .save.error i{background:var(--err)}
.course{display:flex;gap:6px;padding:0 0 10px}
.course button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;color:var(--muted);transition:all var(--t)}
.course button[aria-selected="true"]{border-color:var(--line2);background:var(--gold-soft);color:var(--text)}
.course small{display:block;font-size:10px;letter-spacing:.18em;color:var(--gold);line-height:1.2;margin-top:2px}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(16,26,46,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
nav.bottom button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:10.5px;white-space:nowrap;letter-spacing:-.02em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:44px}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.bottom button[aria-current="page"]{color:var(--gold)}
/* content */
main{padding:20px 0 24px}
.view{animation:in 240ms ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--serif);letter-spacing:.28em;font-size:12px;color:var(--gold);text-transform:uppercase}
h1{font-size:24px;line-height:1.45;margin:6px 0 8px;font-weight:600;letter-spacing:.02em}
h2{font-size:18px;margin:0 0 6px;font-weight:600}
h3{font-size:15px;margin:0 0 4px;font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.card.hero{background:linear-gradient(160deg,var(--surface2),var(--surface));border-color:var(--line2)}
.grid{display:grid;gap:10px}
.grid.two{grid-template-columns:1fr 1fr}
@media (max-width:420px){.grid.two{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--line2);background:var(--gold);color:#14213A;font-weight:600;cursor:pointer;transition:transform var(--t),opacity var(--t);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--text)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrapx{flex-wrap:wrap}
.spacer{flex:1}
.list{list-style:none;padding:0;margin:0}
.item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin:10px 0;cursor:pointer;width:100%;text-align:left;transition:border-color var(--t)}
.item:hover{border-color:var(--line2)}
.num{font-family:var(--serif);font-size:22px;color:var(--gold);width:34px;flex:none;text-align:center}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:13px;letter-spacing:.12em;color:var(--gold);font-weight:500}
.item .t span{display:block;font-size:15px}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{border-color:rgba(127,200,169,.5);color:var(--ok)}
.badge.gold{border-color:var(--line2);color:var(--gold)}
.bar{height:6px;border-radius:6px;background:rgba(245,245,240,.08);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#A88B52,var(--gold));border-radius:6px;transition:width 400ms ease}
label.f{display:block;font-size:14px;margin:14px 0 6px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{width:100%;background:#0E1728;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;font-size:16px;line-height:1.7;transition:border-color var(--t)}
textarea{min-height:140px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
.hint{font-size:13px;color:var(--muted);background:rgba(245,245,240,.04);border-left:2px solid var(--gold);padding:10px 12px;border-radius:0 10px 10px 0;margin:10px 0}
.steps{display:flex;gap:4px;margin:12px 0}
.steps i{flex:1;height:3px;border-radius:3px;background:rgba(245,245,240,.12)}
.steps i.on{background:var(--gold)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi div{background:#0E1728;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;font-family:var(--serif);color:var(--gold)}
.kpi span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0;scrollbar-width:none}
.tabs button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--line2);background:var(--gold-soft)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 14px;border-radius:14px;max-width:92%;white-space:pre-wrap;font-size:15px}
.msg.me{align-self:flex-end;background:var(--gold-soft);border:1px solid var(--line2)}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.book-page{background:#F5F5F0;color:#172B4D;border-radius:14px;padding:22px;margin:14px 0}
.book-page .eyebrow{color:#8A7442}
.book-page h2{font-family:var(--serif);font-size:22px;letter-spacing:.04em}
.book-page p{white-space:pre-wrap}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(5,9,18,.72);display:grid;place-items:center;padding:16px}
.dlg .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.banner{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px;display:flex;gap:10px;align-items:flex-start}
.banner.err{color:var(--err);border-color:rgba(229,140,140,.45)}
.lock{display:grid;place-items:center;text-align:center;padding:24px 8px}
.lock svg{width:44px;height:44px;stroke:var(--gold);fill:none;stroke-width:1.4;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity var(--t);max-width:calc(100% - 32px)}
.toast.show{opacity:1}
/* intro */
.intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px;text-align:center}
.intro .glow{position:absolute;inset:0;background:radial-gradient(50% 40% at 50% 40%,rgba(199,170,112,.22),transparent 70%);animation:glow 2.4s ease both;pointer-events:none}
@keyframes glow{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.intro .in{position:relative;max-width:420px;animation:in 900ms 200ms ease both}
.intro .logo{font-family:var(--serif);font-size:34px;letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
.skip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
hr.s{border:0;border-top:1px solid var(--line);margin:16px 0}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--line2);color:var(--text);background:var(--gold-soft)}
.log{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#0E1728;font-size:14px}
.log dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0}
.log dt{color:var(--gold);font-size:12px} .log dd{margin:0;white-space:pre-wrap}
.auth{max-width:420px;margin:8vh auto 0;text-align:center}
.auth .logo{font-family:var(--serif);font-size:30px;letter-spacing:.3em;color:var(--gold)}
.mode{font-size:12px;color:var(--warn);border:1px solid rgba(227,181,102,.35);border-radius:10px;padding:8px 12px;margin:0 0 12px}
.save.conflict i{background:var(--err)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;color:#172B4D;padding:0}
  header.top,nav.bottom,.noprint,.toast{display:none!important}
  .book-page{border:0;margin:0 0 18px;page-break-inside:avoid;padding:0}
  main{padding:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row">
      <div class="brand">LIFE STAGE <b>2.0</b></div>
      <div class="save" id="save" role="status" aria-live="polite"><i></i><span>保存済み</span></div>
    </div>
  </div>
</header>
<main class="wrap" id="app" tabindex="-1"><p class="empty">読み込み中…</p></main>
<nav class="bottom" id="nav" aria-label="メインナビゲーション">
  <div class="wrap">
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg>ホーム</button>
    <button data-tab="journey"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h5a3 3 0 000-6h-2a3 3 0 010-6h5"/></svg>ジャーニー</button>
    <button data-tab="ai"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18 9.4l-4.2 1.8L12 16l-1.8-4.8L6 9.4l4.2-1.8z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>AI</button>
    <button data-tab="book"><svg viewBox="0 0 24 24"><path d="M5 4h10a4 4 0 014 4v12H9a4 4 0 01-4-4z"/><path d="M5 16a4 4 0 014-4h10"/></svg>ブック</button>
    <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>設定</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p class="wrap">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
<script src="app.js"></script>
</body>
</html>
