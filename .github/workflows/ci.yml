name: CI
on:
  pull_request:
  push:
    branches: [main, master]
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + integration + security tests (incl. RLS against real Postgres via PGlite)
        run: pnpm test
      - name: Edge shared bundle builds
        run: pnpm build:edge-shared
      - name: Web build
        run: pnpm build:web
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - name: Mobile build validation (Metro bundles iOS + Android, config resolves)
        working-directory: apps/mobile
        env: { EXPO_NO_TELEMETRY: "1", EXPO_OFFLINE: "1", CI: "1", EXPO_PUBLIC_APP_ENV: preview }
        run: |
          npx expo config --type public --json > /dev/null
          npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/export"
